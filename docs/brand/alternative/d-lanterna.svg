  <circle cx="32" cy="26" r="4.6" fill="#f2a900"/>
  <circle cx="32" cy="36" r="4.2" fill="#3fbf6a" opacity=".3"/>
  <g fill="none" stroke="#f2a900" stroke-width="2.2" stroke-linecap="round">
    <path d="M45 20.5a8 8 0 0 1 0 11"/>
