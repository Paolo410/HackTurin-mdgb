# MDGB smartcrossing configuration.
# Every threshold lives here: no magic numbers in the code.
# "(spec)" = value fixed by PROMPT_SMART_CROSSING.md. The others are tunable defaults.

model:
  family: yolox                   # yolox | picodet (PP-PicoDet-S, scripts/get_picodet.py; fixed 320 or 416 input)
  path: models/yolox_nano_dynamic.onnx   # relative to ai/, made by scripts/get_model.sh (free input size)
  input_size: 320                 # (spec) 320, 416 optional. Must be a multiple of the largest stride.
  match_aspect: true              # same number of pixels as input_size squared, shaped like the image:
                                  # no input wasted on padding, objects seen larger at the same cost
  conf: 0.10                      # minimum score (objectness * class probability) handed to the tracker. Boxes
                                  # between 0.1 and tracking.track_activation_threshold only keep existing tracks
                                  # alive (ByteTrack): with 0.30 tracks broke every second at 10 FPS and at night
  nms: 0.45                       # IoU threshold of the per-class NMS
  nms_cross_class: 0.85           # boxes of different classes above this IoU are one object: keep the best
  intra_op_num_threads: 0         # 0 = let onnxruntime decide
  providers: [CPUExecutionProvider]   # onnxruntime providers. The board has a CPU only; the benchmark reference on a
                                  # Mac uses [CoreMLExecutionProvider, CPUExecutionProvider]
  detect_every_n: 1               # run the detector every N frames; in between the last tracks are held
  strides: [8, 16, 32]            # YOLOX head strides
  pad_value: 114                  # (spec) letterbox padding value
  keep_classes:                   # (spec) COCO classes kept
    [person, bicycle, car, motorcycle, bus, truck, dog, cat, horse, sheep, cow, bear, bird]

source:
  resize_width: 960               # frames wider than this are downscaled, keeping the aspect ratio; 0 = keep
  max_fps: 0                      # processing rate cap; 0 = unlimited
  file_realtime: true             # play video files at their own speed (false = as fast as possible)
  file_drop_late: true            # in real time, skip the frames that are already late, as a camera drops them
  samples_dir: samples            # default video folder (git-ignored); if empty the webcam is used
  video_extensions: [.mp4, .mov, .avi, .mkv, .m4v]

camera:                           # the board's camera (IMX219 on CSI): exposure set once before it starts,
                                  # because the automatic exposure of libcamera's software ISP does not settle
  sensor: imx219                  # name of the sensor among /dev/v4l-subdev*
  target_brightness: 125          # mean brightness (0-255) aimed at
  brightness_band: [100, 150]     # nothing is changed while the measured brightness is in this band
  attempts: 3                     # measure-and-set rounds at most (each about 2 s)
  gain_base: 256                  # IMX219: analogue gain = 256 / (256 - code)
  gain_min: 0                     # limits of the sensor's controls (v4l2-ctl --list-ctrls)
  gain_max: 232
  exposure_min: 4
  exposure_max: 3522              # lines; raised only when the gain is at its top (a long exposure blurs motion)
  measure_frames: 12              # frames read for one measurement,
  measure_period_s: 0.1           # one every this long,
  measure_keep: 5                 # the last ones are averaged
  measure_timeout_s: 20

tracking:
  track_activation_threshold: 0.30
  lost_track_buffer: 30           # frames a lost track is kept before its ID is dropped
  minimum_matching_threshold: 0.9 # 1 - IoU allowed between a track and its box: at 5-6 detections per second
                                  # (board) an object moves more between two of them. Was 0.8
  minimum_consecutive_frames: 1
  box_buffer: 0.5                 # boxes enlarged by this share of their size on each side for the pairing only
                                  # (buffered IoU, see tracking.py): fast or far objects keep their ID. 0 = off.
                                  # 0.5 counted more than 0.3 on the benchmark (ai/docs/BENCHMARK.md)
  matched_box: true               # return each track with the box it was matched with (tracking.py); false =
                                  # supervision's own pairing, which loses fast objects
  min_track_age: 5                # (spec) frames before a track is considered valid
  measure_min_conf: 0.30          # boxes below this score keep a track alive but measure no height, cast no class vote
  history_len: 150                # positions kept per track (5 s at 30 frames per second)
  default_frame_rate: 30          # rate given to ByteTrack when the source does not report one

geometry:
  waiting_zone_depth_m: 1.5       # depth of the waiting zones on the two pavements
  waiting_zone_margin_m: 1.0      # how far the waiting zones extend beyond the sides of the stripes
  carriageway_extent_m: 150       # road considered before and after the stripes
  ped_line_margin_m: 2.0          # the pedestrian line extends this far beyond the stripes
  veh_line_offset_m: middle       # vehicle line through the middle of the stripes (both directions fully
                                  # in view), or a number: metres before the stripes
  scale_probe_px: 5               # half width of the step used to measure the local scale
  height_scale: 1.0               # correction of sizes in metres (tune with a person of known height)
  camera_tolerance: 0.2           # the camera position is worked out from the calibration, and used for
                                  # heights, only if the calibration fits a real camera this well (0 = perfectly;
                                  # 0.2 accepts corners clicked 4 px off, rejects swapped corners or wrong sizes)
  min_height_ratio: 0.2           # otherwise heights are rough, and a metre of height never counts as less
                                  # than this share of a metre across (view from straight above)

kinematics:
  ema_samples: 5                  # (spec) speed is an EMA over 5 samples
  window_s: 0.5                   # each sample is the displacement over this time, not over one frame
  min_window_s: 0.15              # shortest time over which a speed is measured
  max_dt_s: 1.0                   # samples older than this are not used
  max_speed_ms: 70                # a faster jump is the tracker moving an ID to another object
  max_metres_per_px: 0.5          # no speed where one pixel is more than this on the ground (too far)
  edge_margin: 0.01               # no speed for boxes this close to the image border (fraction of the size);
                                  # null = no check

attributes:
  child_height_m: 1.30            # (spec) below this median height the pedestrian is a child
  height_samples: 5               # (spec) frames used for the median height
  height_min_box_px: 30           # a box shorter than this is too coarse to tell 1.3 m from 1.7 m:
                                  # the pedestrian stays undecided (not a child) until seen larger. The same
                                  # when the calibration does not fit a real camera (geometry.camera_tolerance)
  slow_speed_ms: 0.9              # (spec) below this walking speed the pedestrian is slow
  slow_min_time_s: 2.0            # (spec) the walking speed is the progress made over this time
  slow_min_samples: 3             # measures needed before deciding
  moving_min_speed_ms: 0.2        # below this the pedestrian is standing: not part of the walking speed
  walk_speed_samples: 100         # recent walking samples kept for the median walking speed
  aid_model_path: models/aid_cls.onnx   # (spec) optional classifier; missing file = aid unknown
  aid_input_size: 96              # (spec) crops are 96x96
  aid_classes: [normal, wheelchair, walking_aid, stroller]   # (spec)
  aid_votes: 5                    # (spec) vote on 3-5 crops
  aid_min_votes: 3
  aid_every_n_frames: 5           # frames between two crops of the same track

rules:
  reaction_time_s: 1.0            # (spec) d_stop = v * 1.0 + v^2 / (2 * 7.0)
  deceleration_ms2: 7.0           # (spec)
  crossing_margin_s: 1.0          # (spec) T_need = W / v_ped + 1.0
  v_ped_default_ms: 1.2           # (spec)
  v_ped_vulnerable_ms: 0.8        # (spec) child, slow, aid, thermal-only pedestrian
  v_ped_min_ms: 0.3               # floor for the measured walking speed
  stop_margin_m: 10               # (spec) WARN_DRIVER needs d > d_stop + 10
  not_braking_ms2: -2.0           # (spec) the vehicle is not braking if a > -2 m/s^2
  intention_wait_s: 1.0           # (spec) waiting longer than this shows the intention to cross
  toward_road_min_ms: 0.3         # speed towards the road that shows the intention to cross
  vehicle_min_speed_ms: 1.0       # slower vehicles are not approaching
  vehicle_roles: [car, bus, truck, motorcyclist]
  pedestrian_roles: [pedestrian]
  green_max_s: 25                 # (spec) green_s = min(25, max(W / 1.2, W / v_ped) + 2)
  green_margin_s: 2               # (spec)
  ped_green_extend_max_s: 15      # (spec) limit of the signal controller on the green extension
  supervision_distance_m: 2.0     # a child with somebody who is not a child within this distance is not alone
  red_now_animal_sizes: [medium, large]   # free animals on the road that call the red for the vehicles at once
  video_timeout_s: 1.0            # (spec) no frames for longer than this = DEGRADED
  hold_s: 1.0                     # a state is kept this long before stepping down (no flicker)
  default_W_m: 7.0                # road width used when calib.json has no metric calibration
  herd_min_size: 2                # animals close together that make a herd
  animal_margin_m: 30             # (spec) ANIMAL_WARN: vehicle within d_stop + this (40 on the "collina" site)
  animal_alert_hold_s: 2.0        # (spec) the alert stays on 2 s after the last animal left the road
  led:                            # proposal, to be confirmed with firmware
    IDLE: "OFF"
    PRESENCE: WHITE_ON
    WARN_DRIVER: AMBER_BLINK_2HZ
    WARN_PEDESTRIAN: RED_GROUND_BLINK
    ANIMAL_WARN: AMBER_BLINK_2HZ
    ANIMAL_ALERT: AMBER_BLINK_4HZ
    DEGRADED: YELLOW_FAILSAFE
  lcd_max_chars: 32               # 2 rows of 16 ASCII characters

site: urbano                      # default --site
sites:                            # (spec) which animals matter where
  urbano:     {animal_classes: [dog, cat], birds: false, animal_margin_m: 30}
  lungofiume: {animal_classes: [dog, cat], birds: true, animal_margin_m: 30}
  collina:    {animal_classes: [dog, cat, horse, sheep, cow, bear], birds: false, animal_margin_m: 40}

animals:
  large_length_m: 0.8             # (spec) large: length >= 0.8 m or height >= 0.6 m
  large_height_m: 0.6
  medium_length_m: 0.3            # (spec) medium: 0.3-0.8 m; below: small, log only
  leash_distance_m: 2.0           # (spec) a person within 2 m ...
  leash_angle_deg: 45             # (spec) ... moving in a similar direction ...
  leash_time_s: 1.0               # (spec) ... for at least 1 s: the animal is on a leash
  herd_distance_m: 3.0            # (spec) animals within 3 m are one herd
  bird_min_length_m: 0.5          # (spec) a bird counts only if this long (goose, swan) ...
  bird_min_time_s: 2.0            # (spec) ... and on the road for more than 2 s

events:
  collision_distance_m: 1.0       # (spec) two tracks closer than this ...
  collision_fast_ms: 3.0          # (spec) ... at least one was faster than this ...
  collision_stopped_ms: 0.3       # (spec) ... then both slower than this ...
  collision_window_s: 1.5         # (spec) ... within this time
  person_down_aspect: 1.2         # (spec) box width / height above this ...
  person_down_time_s: 3.0         # (spec) ... for longer than this, on the road
  hard_brake_ms2: 6.0             # (spec) deceleration above this
  hard_brake_min_speed_ms: 3.0    # only for vehicles that were actually moving
  near_miss_ttc_s: 1.0            # (spec) TTC below this ...
  near_miss_pet_s: 1.0            # (spec) ... or PET below this, between a vehicle and a pedestrian or animal
  near_miss_lateral_m: 1.5        # the vehicle must be heading at the pedestrian within this side distance
  near_miss_min_speed_ms: 3.0     # slower vehicles do not make a near miss by TTC
  max_distance_m: 30              # braking and collisions are judged only this close to the stripes:
                                  # farther away the calibration is too coarse for accelerations
  pet_radius_m: 1.0               # two tracks passed "through the same point" within this distance
  stopped_on_crosswalk_s: 10.0    # (spec) vehicle standing on the stripes for longer than this
  stopped_ms: 0.3                 # below this speed a vehicle is standing
  yield_speed_ms: 2.0             # (spec) a vehicle yields if it slows below this before the stripes

logger:
  enabled: true                   # C3 events for comms/ (docs/CONTRACTS.md); never frames
  dir: ../logs/c3                 # relative to ai/; the environment variable MDGB_C3_DIR wins
  prefix: c3
  rotate_s: 3600                  # a new file every hour
  status_every_s: 5.0             # period of the "status" event

thermal:                          # optional, --thermal; sensor in the kit: Grove MLX90621, 16x4
  rows: 4
  columns: 16
  warm_delta_c: 3.0               # (spec) a column is warm above ambient + 3 C
  night_luminance: 50             # mean grey level (0-255) below which the image is dark
  night_after_s: 5.0              # (spec) dark for longer than this = night mode (same delay to leave it)
  recover_after_s: 0.5            # (spec) heat with no RGB person for this long = unclassified pedestrian
  drop_unconfirmed: false         # true = ignore RGB persons with no heat at night (posters, reflections)
  max_frame_age_s: 2.0            # older thermal frames are not trusted
  calib_path: calib_thermal.json  # which columns look at which zone
  example_calib_path: calib_thermal.example.json
  sim_ambient_c: 14.0             # --thermal sim: background temperature ...
  sim_body_c: 30.0                # ... temperature of the simulated person ...
  sim_columns: [2, 3]             # ... who stands in these columns ...
  sim_period_s: 20.0              # ... for sim_present_s seconds out of every sim_period_s
  sim_present_s: 8.0

selfcheck:
  every_n_frames: 10              # how often a frame is checked
  laplacian_var_min: 4.0          # below this sharpness the lens is covered (real scenes: 8 or more;
                                  # a covered lens: below 2; measured on the test videos)
  confirm_checks: 2               # a fault counts after this many checks in a row
  saturated_level: 250            # grey level counted as saturated
  saturated_fraction_max: 0.5     # above this fraction of saturated pixels the camera is dazzled

actuator:
  heartbeat_period_s: 0.1         # (spec) C2 every 100 ms
  heartbeat_stale_s: 0.4          # no heartbeat if the vision loop has been silent for this long
  c1_repeat_s: 1.0                # the last C1 is repeated at least this often (CONTRACTS draft)
  max_line_bytes: 238             # longest C1 line the link takes: the arduino-router of the UNO Q refuses longer
                                  # calls (measured 11/10; CONTRACTS says 512). Reason, then texts are cut first
  failsafe_timeout_s: 0.5         # (spec) the firmware falls back after 500 ms without heartbeat

mcu:                              # what the microcontroller tells the vision (C5 lines of CONTRACTS.md)
  applab_series: applab           # files <series>-*.jsonl written in the C3 folder by the App Lab app of the
                                  # sketch (comms/applab/mdgb_link.py), when that part is on the board
  poll_s: 0.5                     # how often those files are read
  lamp_fault_hold_s: 5            # DEGRADED while the firmware keeps reporting a lamp fault this often
  save_bridge_lines: false        # true = the vision also writes the MCU lines it gets on the Bridge (mcu-*.jsonl)
                                  # for the central. False with the App Lab app and mdgb_link.py: no duplicates

operator:                         # page for the technician (--operator-port): badge first, then login
  login_s: 120                    # after the badge: time to log in. Logging in or out uses the badge up
  session_s: 0                    # how long a session lasts after the login; 0 = until the technician logs out.
                                  # With a limit, a badge while logged in starts it again
                                  # From the badge to the logout the C1 command says "tech": true and the
                                  # sketch keeps the buzzer quiet (the badge beep still sounds)
  max_failed_logins: 5            # wrong passwords before the page closes until the next badge
  credentials_file: .env          # relative to ai/, ignored by git; written by scripts/operator_login.py
  share_images: true              # live view of what the vision sees, for the logged-in technician.
                                  # false = statistics only: no image leaves the vision process (privacy)
  stream_fps: 5                   # live view: frames per second,
  stream_width: 480               # width in pixels
  jpeg_quality: 70                # and JPEG quality
  video_seek_s: 10                # recorded videos only: how far the back / forward buttons of the page jump
  playlist_first: []              # recorded videos only: file names shown before the others of the folder, in
                                  # this order; "camera" among them is the live camera. Empty = name order only

derive:
  rider_iou: 0.3                  # (spec) person/two-wheeler IoU above which the person is the rider
  animal_classes: [dog, cat, horse, sheep, cow, bear]   # (spec) COCO classes reported as "animal"

counting:
  minimum_crossing_threshold: 3   # frames past the line before a crossing counts (no jitter counts)
  side_memory: 30                 # detector frames the side of an unseen track is remembered (a car behind a
                                  # pole); 0 = supervision's own limit, threshold + 1 frames
  stitch_s: 0                     # a track lost just before the line and a new one just after it, heading the same
                                  # way within this many seconds, are one crossing (counting.py); 0 = off
  stitch_radius: 1.0              # tolerance around the point where the lost track was expected, in box heights
  stitch_band: 2.0                # both tracks must be this close to the line, in box heights
  calib_path: calib.json          # made by scripts/calibrate.py
  example_calib_path: calib.example.json   # used when calib.json is missing
  lines:                          # roles counted on each line
    ped: [pedestrian, cyclist, animal]              # along the stripes: who crosses the road
    veh: [car, bus, truck, motorcyclist, cyclist]   # across the lane: who drives along the road

overlay:
  window_name: MDGB smartcrossing
  font_scale: 0.5
  thickness: 2
  fps_window_frames: 30           # the FPS shown is the rate over this many frames
  status_every_s: 1.0             # period of the status line in --headless mode
  quit_keys: [q, Q]
  line_arrow_px: 40               # length of the arrow that shows the IN direction
  line_arrow_tip: 0.3             # arrow head, as a fraction of its length
  zones: [crosswalk, waiting_zone_left, waiting_zone_right]   # zones drawn on screen
  reason_max_chars: 110           # longer reasons are cut on screen
  thermal_cell_px: 14             # size of one thermal column on screen
  colors:                         # BGR
    person: [80, 200, 80]
    two_wheeler: [0, 200, 255]
    vehicle: [255, 160, 0]
    animal: [200, 80, 200]
    pending: [150, 150, 150]      # track younger than min_track_age, or two-wheeler with a rider
    line: [0, 255, 255]           # counting lines
    zone: [255, 200, 0]           # zones of the metric calibration
    thermal_warm: [0, 80, 255]
    thermal_cold: [90, 60, 40]
    state:                        # banner colour of each state
      IDLE: [90, 90, 90]
      PRESENCE: [200, 200, 200]
      WARN_DRIVER: [0, 170, 255]
      WARN_PEDESTRIAN: [0, 0, 255]
      ANIMAL_WARN: [0, 170, 255]
      ANIMAL_ALERT: [0, 100, 255]
      DEGRADED: [0, 255, 255]
    text: [255, 255, 255]
    hud_bg: [0, 0, 0]

bench:
  frames: 300                     # frames measured
  warmup_frames: 10               # frames discarded before measuring
  percentile: 95

# At 10 FPS a track is valid after 2 frames instead of 5: five frames are half a second, and a car at
# 30 km/h has crossed the counting line before its track counts (Turin video: 16 vehicles counted of the
# 35 counted at 30 FPS; with 2 frames, 28).
# Measured on the board (10/10/2026, 720p crowd video, board otherwise idle): at 320 px the detector takes
# 148 ms and the whole chain runs at 5.8 FPS with 4 threads, 6.0 with 3; 256 px reaches 8.8 FPS but loses half
# of the vehicles of the Turin video. The detector on one frame out of two keeps 320 px and runs at 12.8 FPS.
profiles:
  pc: {}
  unoq:
    # detector on every frame: 5.9 FPS on the board, all analysed, against 8.4 FPS with half of them only held
    # (4.2 analysed per second). More vehicles and pedestrians counted (ai/docs/BENCHMARK.md)
    model: {input_size: 320, intra_op_num_threads: 3, detect_every_n: 1}
    source: {max_fps: 12, resize_width: 640}
    # demo on the board: two recorded scenes, then what the node sees now, then the other videos of the folder
    operator: {playlist_first: [Torino_2.mp4, Torino_night_1.mp4, camera]}
    tracking: {min_track_age: 2}

# Applied on top of the profile by --emulate-unoq. (spec) 10 FPS, input 320, 4 onnxruntime threads.
emulate_unoq:
  model: {input_size: 320, intra_op_num_threads: 4}
  source: {max_fps: 10}
  tracking: {min_track_age: 2}
