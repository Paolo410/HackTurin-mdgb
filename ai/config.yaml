# MDGB smartcrossing configuration.
# Every threshold lives here: no magic numbers in the code.
# "(spec)" = value fixed by PROMPT_SMART_CROSSING.md. The others are tunable defaults.

model:
  path: models/yolox_nano_dynamic.onnx   # relative to ai/, made by scripts/get_model.sh (free input size)
  input_size: 320                 # (spec) 320, 416 optional. Must be a multiple of the largest stride.
  conf: 0.30                      # minimum score (objectness * class probability)
  nms: 0.45                       # IoU threshold of the per-class NMS
  nms_cross_class: 0.85           # boxes of different classes above this IoU are one object: keep the best
  intra_op_num_threads: 0         # 0 = let onnxruntime decide
  detect_every_n: 1               # run the detector every N frames; in between the last tracks are held
  strides: [8, 16, 32]            # YOLOX head strides
  pad_value: 114                  # (spec) letterbox padding value
  keep_classes:                   # (spec) COCO classes kept
    [person, bicycle, car, motorcycle, bus, truck, dog, cat, horse, sheep, cow, bear, bird]

source:
  resize_width: 960               # frames wider than this are downscaled, keeping the aspect ratio; 0 = keep
  max_fps: 0                      # processing rate cap; 0 = unlimited
  file_realtime: true             # play video files at their own speed (false = as fast as possible)
  samples_dir: samples            # default video folder (git-ignored); if empty the webcam is used
  video_extensions: [.mp4, .mov, .avi, .mkv, .m4v]

tracking:
  track_activation_threshold: 0.30
  lost_track_buffer: 30           # frames a lost track is kept before its ID is dropped
  minimum_matching_threshold: 0.8
  minimum_consecutive_frames: 1
  min_track_age: 5                # (spec) frames before a track is considered valid
  history_len: 60                 # positions kept per track
  default_frame_rate: 30          # rate given to ByteTrack when the source does not report one

geometry:
  waiting_zone_depth_m: 1.5       # depth of the waiting zones on the two pavements
  waiting_zone_margin_m: 1.0      # how far the waiting zones extend beyond the sides of the stripes
  carriageway_extent_m: 150       # road considered before and after the stripes
  ped_line_margin_m: 2.0          # the pedestrian line extends this far beyond the stripes
  veh_line_offset_m: 2.0          # the vehicle line is this far before the stripes
  scale_probe_px: 5               # half width of the step used to measure the local scale
  height_scale: 1.0               # correction of sizes in metres (tune with a person of known height)

kinematics:
  ema_samples: 5                  # (spec) speed is an EMA over 5 samples
  max_dt_s: 1.0                   # a gap longer than this restarts the speed estimate

attributes:
  child_height_m: 1.30            # (spec) below this median height the pedestrian is a child
  height_samples: 5               # (spec) frames used for the median height
  slow_speed_ms: 0.9              # (spec) below this walking speed the pedestrian is slow
  slow_min_time_s: 2.0            # (spec) walking time needed before deciding
  moving_min_speed_ms: 0.2        # below this the pedestrian is standing: not part of the walking speed
  walk_speed_samples: 100         # recent walking samples kept for the median walking speed
  aid_model_path: models/aid_cls.onnx   # (spec) optional classifier; missing file = aid unknown
  aid_input_size: 96              # (spec) crops are 96x96
  aid_classes: [normal, wheelchair, walking_aid, stroller]   # (spec)
  aid_votes: 5                    # (spec) vote on 3-5 crops
  aid_min_votes: 3
  aid_every_n_frames: 5           # frames between two crops of the same track

rules:
  reaction_time_s: 1.0            # (spec) d_stop = v * 1.0 + v^2 / (2 * 7.0)
  deceleration_ms2: 7.0           # (spec)
  crossing_margin_s: 1.0          # (spec) T_need = W / v_ped + 1.0
  v_ped_default_ms: 1.2           # (spec)
  v_ped_vulnerable_ms: 0.8        # (spec) child, slow, aid, thermal-only pedestrian
  v_ped_min_ms: 0.3               # floor for the measured walking speed
  stop_margin_m: 10               # (spec) WARN_DRIVER needs d > d_stop + 10
  not_braking_ms2: -2.0           # (spec) the vehicle is not braking if a > -2 m/s^2
  intention_wait_s: 1.0           # (spec) waiting longer than this shows the intention to cross
  toward_road_min_ms: 0.3         # speed towards the road that shows the intention to cross
  vehicle_min_speed_ms: 1.0       # slower vehicles are not approaching
  vehicle_roles: [car, bus, truck, motorcyclist]
  pedestrian_roles: [pedestrian]
  green_max_s: 25                 # (spec) green_s = min(25, max(W / 1.2, W / v_ped) + 2)
  green_margin_s: 2               # (spec)
  ped_green_extend_max_s: 15      # (spec) limit of the signal controller on the green extension
  video_timeout_s: 1.0            # (spec) no frames for longer than this = DEGRADED
  hold_s: 1.0                     # a state is kept this long before stepping down (no flicker)
  default_W_m: 7.0                # road width used when calib.json has no metric calibration
  herd_min_size: 2                # animals close together that make a herd
  animal_margin_m: 30             # (spec) ANIMAL_WARN: vehicle within d_stop + this (40 on the "collina" site)
  animal_alert_hold_s: 2.0        # (spec) the alert stays on 2 s after the last animal left the road
  led:                            # proposal, to be confirmed with firmware
    IDLE: "OFF"
    PRESENCE: WHITE_ON
    WARN_DRIVER: AMBER_BLINK_2HZ
    WARN_PEDESTRIAN: RED_GROUND_BLINK
    ANIMAL_WARN: AMBER_BLINK_2HZ
    ANIMAL_ALERT: AMBER_BLINK_4HZ
    DEGRADED: YELLOW_FAILSAFE
  lcd_max_chars: 32               # 2 rows of 16 ASCII characters

site: urbano                      # default --site
sites:                            # (spec) which animals matter where
  urbano:     {animal_classes: [dog, cat], birds: false, animal_margin_m: 30}
  lungofiume: {animal_classes: [dog, cat], birds: true, animal_margin_m: 30}
  collina:    {animal_classes: [dog, cat, horse, sheep, cow, bear], birds: false, animal_margin_m: 40}

animals:
  large_length_m: 0.8             # (spec) large: length >= 0.8 m or height >= 0.6 m
  large_height_m: 0.6
  medium_length_m: 0.3            # (spec) medium: 0.3-0.8 m; below: small, log only
  leash_distance_m: 2.0           # (spec) a person within 2 m ...
  leash_angle_deg: 45             # (spec) ... moving in a similar direction ...
  leash_time_s: 1.0               # (spec) ... for at least 1 s: the animal is on a leash
  herd_distance_m: 3.0            # (spec) animals within 3 m are one herd
  bird_min_length_m: 0.5          # (spec) a bird counts only if this long (goose, swan) ...
  bird_min_time_s: 2.0            # (spec) ... and on the road for more than 2 s

events:
  collision_distance_m: 1.0       # (spec) two tracks closer than this ...
  collision_fast_ms: 3.0          # (spec) ... at least one was faster than this ...
  collision_stopped_ms: 0.3       # (spec) ... then both slower than this ...
  collision_window_s: 1.5         # (spec) ... within this time
  person_down_aspect: 1.2         # (spec) box width / height above this ...
  person_down_time_s: 3.0         # (spec) ... for longer than this, on the road
  hard_brake_ms2: 6.0             # (spec) deceleration above this
  hard_brake_min_speed_ms: 3.0    # only for vehicles that were actually moving
  near_miss_ttc_s: 1.0            # (spec) TTC below this ...
  near_miss_pet_s: 1.0            # (spec) ... or PET below this, between a vehicle and a pedestrian or animal
  near_miss_lateral_m: 1.5        # the vehicle must be heading at the pedestrian within this side distance
  pet_radius_m: 1.0               # two tracks passed "through the same point" within this distance
  stopped_on_crosswalk_s: 10.0    # (spec) vehicle standing on the stripes for longer than this
  stopped_ms: 0.3                 # below this speed a vehicle is standing
  yield_speed_ms: 2.0             # (spec) a vehicle yields if it slows below this before the stripes

logger:
  enabled: true                   # C3 events for comms/ (docs/CONTRACTS.md); never frames
  dir: ../logs/c3                 # relative to ai/; the environment variable MDGB_C3_DIR wins
  prefix: c3
  rotate_s: 3600                  # a new file every hour
  status_every_s: 5.0             # period of the "status" event

selfcheck:
  every_n_frames: 10              # how often a frame is checked
  laplacian_var_min: 15.0         # below this sharpness the lens is covered
  saturated_level: 250            # grey level counted as saturated
  saturated_fraction_max: 0.5     # above this fraction of saturated pixels the camera is dazzled

actuator:
  heartbeat_period_s: 0.1         # (spec) C2 every 100 ms
  heartbeat_stale_s: 0.4          # no heartbeat if the vision loop has been silent for this long
  c1_repeat_s: 1.0                # the last C1 is repeated at least this often (CONTRACTS draft)
  failsafe_timeout_s: 0.5         # (spec) the firmware falls back after 500 ms without heartbeat

derive:
  rider_iou: 0.3                  # (spec) person/two-wheeler IoU above which the person is the rider
  animal_classes: [dog, cat, horse, sheep, cow, bear]   # (spec) COCO classes reported as "animal"

counting:
  minimum_crossing_threshold: 3   # frames past the line before a crossing counts (no jitter counts)
  calib_path: calib.json          # made by scripts/calibrate.py
  example_calib_path: calib.example.json   # used when calib.json is missing
  lines:                          # roles counted on each line
    ped: [pedestrian, cyclist, animal]              # along the stripes: who crosses the road
    veh: [car, bus, truck, motorcyclist, cyclist]   # across the lane: who drives along the road

overlay:
  window_name: MDGB smartcrossing
  font_scale: 0.5
  thickness: 2
  fps_ema_alpha: 0.1              # smoothing of the FPS shown on screen
  status_every_s: 1.0             # period of the status line in --headless mode
  quit_keys: [q, Q]
  line_arrow_px: 40               # length of the arrow that shows the IN direction
  line_arrow_tip: 0.3             # arrow head, as a fraction of its length
  zones: [crosswalk, waiting_zone_left, waiting_zone_right]   # zones drawn on screen
  reason_max_chars: 110           # longer reasons are cut on screen
  colors:                         # BGR
    person: [80, 200, 80]
    two_wheeler: [0, 200, 255]
    vehicle: [255, 160, 0]
    animal: [200, 80, 200]
    pending: [150, 150, 150]      # track younger than min_track_age, or two-wheeler with a rider
    line: [0, 255, 255]           # counting lines
    zone: [255, 200, 0]           # zones of the metric calibration
    state:                        # banner colour of each state
      IDLE: [90, 90, 90]
      PRESENCE: [200, 200, 200]
      WARN_DRIVER: [0, 170, 255]
      WARN_PEDESTRIAN: [0, 0, 255]
      ANIMAL_WARN: [0, 170, 255]
      ANIMAL_ALERT: [0, 100, 255]
      DEGRADED: [0, 255, 255]
    text: [255, 255, 255]
    hud_bg: [0, 0, 0]

bench:
  frames: 300                     # frames measured
  warmup_frames: 10               # frames discarded before measuring
  percentile: 95

profiles:
  pc: {}
  unoq:
    model: {input_size: 320, intra_op_num_threads: 4}
    source: {max_fps: 10, resize_width: 640}

# Applied on top of the profile by --emulate-unoq. (spec) 10 FPS, input 320, 4 onnxruntime threads.
emulate_unoq:
  model: {input_size: 320, intra_op_num_threads: 4}
  source: {max_fps: 10}
