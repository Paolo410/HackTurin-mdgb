# Broker MQTT per la demo (gira sul laptop).  Avvio:  mosquitto -c backend/mosquitto.conf -v
# ATTENZIONE: configurazione da hackathon (nessuna autenticazione). In produzione: TLS su 8883 + utenti/ACL.
listener 1883 0.0.0.0
allow_anonymous true

# Persistenza: le sessioni dei subscriber (es. ingest) e i messaggi QoS 1 in coda sopravvivono al riavvio del broker
persistence true
persistence_location ./mosquitto-data/
autosave_interval 10

# coda per i client con sessione persistente temporaneamente disconnessi
max_queued_messages 100000
